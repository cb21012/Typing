<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>US Keyboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      padding: 20px;
    }

    .keyboard {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      padding: 18px 20px;
      background: #111;
      border-radius: 12px;
      border: 1px solid #333;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
    }

    /* ── Main key block ── */
    .main-block {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .row {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    /* ── Gap between main and numpad ── */
    .section-gap {
      width: 16px;
      flex-shrink: 0;
    }

    /* ── Numpad: CSS Grid (independent, no flex interference) ── */
    .numpad-block {
      display: grid;
      grid-template-columns: repeat(4, 42px);
      grid-template-rows: repeat(5, 42px);
      gap: 5px;
    }

    /* ── Key base style ── */
    .key {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 42px;
      min-width: 42px;
      padding: 0 6px;
      background: #1e1e1e;
      border: 1px solid #444;
      border-bottom: 3px solid #555;
      border-radius: 5px;
      color: #ccc;
      font-size: 10px;
      font-family: 'Courier New', monospace;
      cursor: default;
      user-select: none;
      transition: background 0.15s, color 0.15s, border-color 0.15s, box-shadow 0.15s;
      text-align: center;
      line-height: 1.2;
    }

    .key .top {
      font-size: 9px;
    }

    .key .bot {
      font-size: 10px;
    }

    .key.highlight {
      background: #e6b800;
      border-color: #ffd700;
      border-bottom-color: #b8860b;
      color: #000;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.7);
      font-weight: bold;
    }

    /* ── Main keyboard width helpers ── */
    .w75 {
      min-width: 32px;
    }

    .w100 {
      min-width: 42px;
    }

    .w125 {
      min-width: 53px;
    }

    .w150 {
      min-width: 63px;
    }

    .w175 {
      min-width: 73px;
    }

    .w200 {
      min-width: 89px;
    }

    .w225 {
      min-width: 95px;
    }

    .w250 {
      min-width: 106px;
    }

    .w275 {
      min-width: 116px;
    }

    .w300 {
      min-width: 127px;
    }

    .wSpace {
      min-width: 312px;
    }

    /* ── Numpad grid placements ── */
    .np-numlk {
      grid-column: 1;
      grid-row: 1;
    }

    .np-slash {
      grid-column: 2;
      grid-row: 1;
    }

    .np-star {
      grid-column: 3;
      grid-row: 1;
    }

    .np-minus {
      grid-column: 4;
      grid-row: 1;
    }

    .np-7 {
      grid-column: 1;
      grid-row: 2;
    }

    .np-8 {
      grid-column: 2;
      grid-row: 2;
    }

    .np-9 {
      grid-column: 3;
      grid-row: 2;
    }

    .np-plus {
      grid-column: 4;
      grid-row: 2 / span 2;
      height: auto;
    }

    .np-4 {
      grid-column: 1;
      grid-row: 3;
    }

    .np-5 {
      grid-column: 2;
      grid-row: 3;
    }

    .np-6 {
      grid-column: 3;
      grid-row: 3;
    }

    .np-1 {
      grid-column: 1;
      grid-row: 4;
    }

    .np-2 {
      grid-column: 2;
      grid-row: 4;
    }

    .np-3 {
      grid-column: 3;
      grid-row: 4;
    }

    .np-enter {
      grid-column: 4;
      grid-row: 4 / span 2;
      height: auto;
    }

    .np-0 {
      grid-column: 1 / span 2;
      grid-row: 5;
      width: auto;
      min-width: unset;
    }

    .np-dot {
      grid-column: 3;
      grid-row: 5;
    }
  </style>
</head>

<body>
  <div class="keyboard" id="keyboard">

    <!-- ════ Main keyboard ════ -->
    <div class="main-block">

      <!-- Row 1: Esc + Number row -->
      <div class="row">
        <div class="key w75" data-keys="Esc"><span>Esc</span></div>
        <div class="key w75" data-keys="`~"><span class="top">~</span><span class="bot">`</span></div>
        <div class="key" data-keys="1!"><span class="top">!</span><span class="bot">1</span></div>
        <div class="key" data-keys="2@"><span class="top">@</span><span class="bot">2</span></div>
        <div class="key" data-keys="3#"><span class="top">#</span><span class="bot">3</span></div>
        <div class="key" data-keys="4$"><span class="top">$</span><span class="bot">4</span></div>
        <div class="key" data-keys="5%"><span class="top">%</span><span class="bot">5</span></div>
        <div class="key" data-keys="6^"><span class="top">^</span><span class="bot">6</span></div>
        <div class="key" data-keys="7&amp;"><span class="top">&amp;</span><span class="bot">7</span></div>
        <div class="key" data-keys="8*"><span class="top">*</span><span class="bot">8</span></div>
        <div class="key" data-keys="9("><span class="top">(</span><span class="bot">9</span></div>
        <div class="key" data-keys="0)"><span class="top">)</span><span class="bot">0</span></div>
        <div class="key" data-keys="-_"><span class="top">_</span><span class="bot">-</span></div>
        <div class="key" data-keys="=+"><span class="top">+</span><span class="bot">=</span></div>
        <div class="key w200" data-keys="Bs"><span>Backspace</span></div>
      </div>

      <!-- Row 2: Tab row -->
      <div class="row">
        <div class="key w200" data-keys="Tab"><span>Tab</span></div>
        <div class="key" data-keys="Q"><span>Q</span></div>
        <div class="key" data-keys="W"><span>W</span></div>
        <div class="key" data-keys="E"><span>E</span></div>
        <div class="key" data-keys="R"><span>R</span></div>
        <div class="key" data-keys="T"><span>T</span></div>
        <div class="key" data-keys="Y"><span>Y</span></div>
        <div class="key" data-keys="U"><span>U</span></div>
        <div class="key" data-keys="I"><span>I</span></div>
        <div class="key" data-keys="O"><span>O</span></div>
        <div class="key" data-keys="P"><span>P</span></div>
        <div class="key" data-keys="[{"><span class="top">{</span><span class="bot">[</span></div>
        <div class="key" data-keys="]}"><span class="top">}</span><span class="bot">]</span></div>
        <div class="key w150" data-keys="\|"><span class="top">|</span><span class="bot">\</span></div>
      </div>

      <!-- Row 3: Caps row -->
      <div class="row">
        <div class="key w250" data-keys="CLK"><span>Caps Lock</span></div>
        <div class="key" data-keys="A"><span>A</span></div>
        <div class="key" data-keys="S"><span>S</span></div>
        <div class="key" data-keys="D"><span>D</span></div>
        <div class="key" data-keys="F"><span>F</span></div>
        <div class="key" data-keys="G"><span>G</span></div>
        <div class="key" data-keys="H"><span>H</span></div>
        <div class="key" data-keys="J"><span>J</span></div>
        <div class="key" data-keys="K"><span>K</span></div>
        <div class="key" data-keys="L"><span>L</span></div>
        <div class="key" data-keys=";:"><span class="top">:</span><span class="bot">;</span></div>
        <div class="key" data-keys="'&quot;"><span class="top">"</span><span class="bot">'</span></div>
        <div class="key w225" data-keys="Enter"><span>Enter</span></div>
      </div>

      <!-- Row 4: Shift row -->
      <div class="row">
        <div class="key w300" data-keys="LShift"><span>Shift</span></div>
        <div class="key" data-keys="Z"><span>Z</span></div>
        <div class="key" data-keys="X"><span>X</span></div>
        <div class="key" data-keys="C"><span>C</span></div>
        <div class="key" data-keys="V"><span>V</span></div>
        <div class="key" data-keys="B"><span>B</span></div>
        <div class="key" data-keys="N"><span>N</span></div>
        <div class="key" data-keys="M"><span>M</span></div>
        <div class="key" data-keys=",<"><span class="top">&lt;</span><span class="bot">,</span></div>
        <div class="key" data-keys=".>"><span class="top">&gt;</span><span class="bot">.</span></div>
        <div class="key" data-keys="/?"><span class="top">?</span><span class="bot">/</span></div>
        <div class="key w275" data-keys="RShift"><span>Shift</span></div>
      </div>

      <!-- Row 5: Bottom row -->
      <div class="row">
        <div class="key w125" data-keys="LCtrl"><span>Ctrl</span></div>
        <div class="key w125" data-keys="LWin"><span>❖</span></div>
        <div class="key w125" data-keys="LAlt"><span>Alt</span></div>
        <div class="key wSpace" data-keys="Space"><span>Space</span></div>
        <div class="key w125" data-keys="RAlt"><span>Alt</span></div>
        <div class="key w125" data-keys="RWin"><span>❖</span></div>
        <div class="key w125" data-keys="Menu"><span>☰</span></div>
        <div class="key w125" data-keys="RCtrl"><span>Ctrl</span></div>
      </div>

    </div><!-- /main-block -->

    <div class="section-gap"></div>

    <!-- ════ Numpad (CSS Grid — tall keys don't affect flex rows) ════ -->
    <div class="numpad-block">
      <div class="key np-numlk" data-keys="NumLk"><span>Num</span><span>Lk</span></div>
      <div class="key np-slash" data-keys="Num/"><span>/</span></div>
      <div class="key np-star" data-keys="Num*"><span>*</span></div>
      <div class="key np-minus" data-keys="Num-"><span>-</span></div>

      <div class="key np-7" data-keys="Num7"><span class="top">Home</span><span class="bot">7</span></div>
      <div class="key np-8" data-keys="Num8"><span class="top">↑</span><span class="bot">8</span></div>
      <div class="key np-9" data-keys="Num9"><span class="top">PgUp</span><span class="bot">9</span></div>
      <div class="key np-plus" data-keys="Num+"><span>+</span></div>

      <div class="key np-4" data-keys="Num4"><span class="top">←</span><span class="bot">4</span></div>
      <div class="key np-5" data-keys="Num5"><span class="bot">5</span></div>
      <div class="key np-6" data-keys="Num6"><span class="top">→</span><span class="bot">6</span></div>

      <div class="key np-1" data-keys="Num1"><span class="top">End</span><span class="bot">1</span></div>
      <div class="key np-2" data-keys="Num2"><span class="top">↓</span><span class="bot">2</span></div>
      <div class="key np-3" data-keys="Num3"><span class="top">PgDn</span><span class="bot">3</span></div>
      <div class="key np-enter" data-keys="NumEnter"><span>Enter</span></div>

      <div class="key np-0" data-keys="Num0"><span class="top">Ins</span><span class="bot">0</span></div>
      <div class="key np-dot" data-keys="NumDot"><span class="top">Del</span><span class="bot">.</span></div>
    </div>

  </div><!-- /keyboard -->

  <script>
    const KEY_MAP = {
      'Tab': ['Tab'],
      'CLK': ['CLK'],
      'LCtrl': ['LCtrl'],
      'RCtrl': ['RCtrl'],
      'LAlt': ['LAlt'],
      'RAlt': ['RAlt'],
      'LShift': ['LShift'],
      'RShift': ['RShift'],
      'Enter': ['Enter'],
      'NumEnter': ['NumEnter'],
      'Bs': ['Bs'],
      'Left': ['Num4'],
      'Right': ['Num6'],
      'Up': ['Num8'],
      'Down': ['Num2'],
      'Space': ['Space'],
      'Esc': ['Esc'],
    };

    const NUMPAD_CHARS = {
      '0': 'Num0', '1': 'Num1', '2': 'Num2', '3': 'Num3', '4': 'Num4',
      '5': 'Num5', '6': 'Num6', '7': 'Num7', '8': 'Num8', '9': 'Num9',
      '.': 'NumDot', '/': 'Num/', '*': 'Num*', '-': 'Num-', '+': 'Num+',
    };

    function showGuide(key) {
      if (KEY_MAP[key]) {
        KEY_MAP[key].forEach(dataKey => {
          document.querySelectorAll('.key').forEach(el => {
            if (el.dataset.keys === dataKey) el.classList.add('highlight');
          });
        });
        return;
      }
      document.querySelectorAll('.key').forEach(el => {
        const dk = el.dataset.keys || '';
        for (const ch of key) {
          if (dk.includes(ch)) { el.classList.add('highlight'); break; }
        }
      });
      for (const ch of key) {
        if (NUMPAD_CHARS[ch]) {
          document.querySelectorAll('.key').forEach(el => {
            if (el.dataset.keys === NUMPAD_CHARS[ch]) el.classList.add('highlight');
          });
        }
      }
    }

    function resetGuide() {
      document.querySelectorAll('.key.highlight').forEach(el => el.classList.remove('highlight'));
    }
  </script>
</body>

</html>
